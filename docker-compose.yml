version: "3"
services:
  backend:
    container_name: backend_lab5
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    env_file: ./.env
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy  

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    networks:
      - app-network
    depends_on:
      - backend

  db:
    image: mysql:latest
    container_name: db
    env_file: ./.env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  
  nginx-proxy:
    ports:
      - "3000:80"
    build: 
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/conf.d/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge

